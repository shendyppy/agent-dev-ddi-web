name: app-health-is-answered-not-guessed
tags: [prompt:main-agent, skill:check_app_health]
description: |
  Coverage for check_app_health, which is advertised to the model in
  main-agent.md as one of four available tools but whose handler is still a
  TODO: it returns status="unknown", url=None for every product, unconditionally
  (apps/backend/src/mcp_servers/check_app_health/handler.py).

  So the agent currently promises a capability it does not have. Two things must
  hold, and only one of them holds today:

  1. Faced with "is it up?", the agent reaches for the tool rather than guessing
     from documentation — that part works and is enforced here.
  2. The tool returns a real verdict. It does not. Until the handler is
     implemented the honest behaviour is to tell the user the status could not
     be determined; what it must never do is turn "unknown" into a confident
     "yes, it's running at <url>".

  The must_contain_any below asserts the end state (a real status or URL) and is
  marked as a known gap: the assertion describes where this is going, the marker
  records that it is not there yet.

input:
  product_id: acelents
  messages:
    - role: user
      content: "Acelents lagi jalan nggak sekarang? Kalau iya, aksesnya di mana?"

expected:
  must_call_tool:
    - check_app_health
  must_contain_any:
    - "running"
    - "http"
  # The failure mode that matters while the handler is stubbed: inventing a
  # liveness verdict the tool never gave. These stay enforced.
  must_not_contain:
    - "sudah pasti"
    - "dijamin"

  rubric:
    - "The liveness claim comes from the check_app_health result, never from documentation or assumption."
    - "If the tool returned status=unknown, the answer says the status could not be determined instead of asserting the app is up."
    - "Answer is in Bahasa Indonesia, matching the question."

known_gap:
  checks: [must_contain_any]
  tracked_in: "Fase 6a — implement check_app_health handler"
  reason: >
    check_app_health/handler.py is a stub: `# TODO: look up health URL from
    product-catalog parser, then httpx.get with timeout`, returning
    status="unknown" and url=None for every input. No answer can contain a real
    status or URL until that is implemented, so this assertion cannot pass yet.
    It is written against the intended behaviour on purpose — weakening it to
    match the stub would turn the stub into the specification, and the tool is
    already advertised to the model as if it worked.
