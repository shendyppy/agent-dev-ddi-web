name: example-product-run-instructions
tags: [prompt:main-agent, skill:search_documentation]
description: |
  When asked how to run a product from the catalog, the agent must call
  search_documentation and return the exact command rather than guessing.

input:
  messages:
    - role: user
      content: "How do I run the Example Product locally?"

expected:
  must_call_tool:
    - search_documentation
  must_contain_any:
    - "pnpm dev"
  must_not_contain:
    - "I'm not sure"
    - "I don't have access to"

  rubric:
    - "Answer cites a source from the product catalog."
    - "Answer is under 200 words."
    - "Answer includes the default URL (http://localhost:3000)."
